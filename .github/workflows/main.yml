# Nome do seu workflow
name: Build and Push ComfyUI Docker Image

# Quando este workflow deve rodar?
on:
  # 1. Quando você fizer um 'push' para a branch 'main'
  push:
    branches: [ "main" ]
  # 2. Permite que você rode manualmente pela aba "Actions"
  workflow_dispatch:

# O que ele deve fazer
jobs:
  build-push:
    # Rodar em um servidor Linux do GitHub
    runs-on: ubuntu-latest
    
    steps:
      # Passo 1: Puxa o seu código (para que ele possa ler o Dockerfile)
      - name: Check out repository
        uses: actions/checkout@v4

      # Passo 2: Configura o "QEMU" (necessário para builds de multiplataforma)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Passo 3: Configura o "Buildx" (a ferramenta de construção do Docker)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Passo 4: Faz o login no Docker Hub (usando seus 'secrets')
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKPOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Passo 5: Constrói a imagem e envia para o Docker Hub
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # MUDE ISSO: para o nome do seu repositório no Docker Hub
          tags: pequenoxd/comfyui-flux-template:latest 
          cache-from: type=registry,ref=pequenoxd/comfyui-flux-template:buildcache
          cache-to: type=registry,ref=pequenoxd/comfyui-flux-template:buildcache,mode=max
